let lang="fr";try{lang=localStorage.getItem("chibre_language")||"fr";}catch(e){}const t=words[lang]||words.fr,ht=historyWords[lang]||historyWords.fr,l=labels[lang]||labels.fr;document.documentElement.lang=words[lang]?lang:"fr";
const KEY="chibre_apple_symbols_v2",OLD_KEY="chibre_apple_sheet_v1",HISTORY_KEY="chibre_apple_history_v1";
function normalizeSheet(item){
 if(!item||!Array.isArray(item.names)||item.names.length<2)return null;
 const names=Array.from({length:3},(_,i)=>typeof item.names[i]==="string"?item.names[i]:"");
 let marks;
 if(Array.isArray(item.marks)&&item.marks.length&&item.marks.every(row=>Array.isArray(row)&&row.every(v=>[null,"apple","stroke","blank"].includes(v))))marks=item.marks.map(row=>Array.from({length:3},(_,i)=>row[i]??null));
 else if(Array.isArray(item.rounds)&&item.rounds.length&&item.rounds.every(row=>Array.isArray(row)&&row.every(v=>v===null||Number.isSafeInteger(v)))){
  // Convert old numeric sheets without deleting the original backup.
  const count=item.playerCount===2?2:3;
  marks=item.rounds.map((row,i)=>{const active=row.slice(0,count),complete=active.every(v=>v!==null);const highest=Math.max(...active.filter((v,c)=>v!==null&&v>=21&&!item.apples?.[i]?.[c]));return Array.from({length:3},(_,c)=>{const v=row[c];if(v==null)return null;if(item.apples?.[i]?.[c]||v<21)return "apple";return complete&&v===highest?"stroke":"blank";});});
 }else return null;
 return {schema:2,playerCount:item.playerCount===2?2:3,names,marks};
}
let data={schema:2,playerCount:3,names:["","",""],marks:Array.from({length:9},()=>[null,null,null])};
try{const raw=localStorage.getItem(KEY),legacy=localStorage.getItem(OLD_KEY);const restored=normalizeSheet(JSON.parse(raw||legacy||"null"));if(restored)data=restored;}catch(e){}
function playerCount(){return data.playerCount===2?2:3;}
function readHistory(){try{const h=JSON.parse(localStorage.getItem(HISTORY_KEY));return Array.isArray(h)?h:[];}catch(e){return [];}}
function persist(candidate=data){try{localStorage.setItem(KEY,JSON.stringify(candidate));return true;}catch(e){document.getElementById("notice").textContent=l.error;return false;}}
function eliminationState(sheet=data,before=Infinity){const count=sheet.playerCount===2?2:3,pending=[0,0,0],eliminated=[false,false,false];for(let i=0;i<Math.min(before,sheet.marks.length);i++){const row=sheet.marks[i];if(row.slice(0,count).some((v,c)=>!eliminated[c]&&v===null))break;row.slice(0,count).forEach((v,c)=>{if(eliminated[c])return;if(v==="apple")pending[c]++;else if(v==="stroke"&&pending[c])pending[c]--;if(pending[c]>=3)eliminated[c]=true;});}return eliminated;}
function rowComplete(index,sheet=data){const eliminated=eliminationState(sheet,index),count=sheet.playerCount===2?2:3;return sheet.marks[index].slice(0,count).every((v,c)=>eliminated[c]||v!==null);}
function blueState(sheet=data){const count=sheet.playerCount===2?2:3,counts=[0,0,0],pending=[0,0,0];let winningRow=-1;for(let i=0;i<sheet.marks.length;i++){const row=sheet.marks[i].slice(0,count);if(!rowComplete(i,sheet))break;row.forEach((v,c)=>{if(eliminationState(sheet,i)[c])return;if(v==="apple")pending[c]++;else if(v==="stroke"){if(pending[c]>0)pending[c]--;else counts[c]++;}});if(counts.some(v=>v>=7)){winningRow=i;break;}}return {counts,winningRow};}
function sheetRowLocked(i){const win=blueState();return win.winningRow>=0&&i>win.winningRow||data.marks.slice(0,i).some((row,index)=>!rowComplete(index));}
function appleCancellingStrokes(){const result=new Set(),pending=[[],[],[]];for(let i=0;i<data.marks.length;i++){const row=data.marks[i].slice(0,playerCount());if(!rowComplete(i))break;row.forEach((v,c)=>{if(v==="apple")pending[c].push(i);else if(v==="stroke"&&pending[c].length){pending[c].pop();result.add(i+":"+c);}});}return result;}
function cancelledAppleCells(){const result=new Set(),pending=[[],[],[]];for(let i=0;i<data.marks.length;i++){const row=data.marks[i].slice(0,playerCount());if(!rowComplete(i))break;row.forEach((v,c)=>{if(v==="apple")pending[c].push(i);else if(v==="stroke"&&pending[c].length)result.add(pending[c].pop()+":"+c);});}return result;}
function extendSheet(){const win=blueState();if(win.winningRow===data.marks.length-1){data.marks.push([null,null,null]);return;}const last=data.marks[data.marks.length-1];if(rowComplete(data.marks.length-1)&&!eliminationState().slice(0,playerCount()).every(Boolean)&&blueState().winningRow<0)data.marks.push([null,null,null]);}
function ask(message,action){const d=document.getElementById("questionDialog");document.getElementById("questionText").textContent=message;d.returnValue="cancel";d.onclose=()=>{if(d.returnValue==="ok")action();};d.showModal();}
function archiveSheet(){if(!data.marks.some(row=>row.some(v=>v!==null)))return true;const history=readHistory();history.unshift({...JSON.parse(JSON.stringify(data)),date:new Date().toISOString()});try{localStorage.setItem(HISTORY_KEY,JSON.stringify(history));return true;}catch(e){document.getElementById("notice").textContent=l.error;return false;}}
let shownVictory="",cellChoice=null;
function updateVictory(){const win=blueState(),d=document.getElementById("appleVictory");if(win.winningRow<0){shownVictory="";if(d.open)d.close();return;}const winners=win.counts.map((n,c)=>n>=7?c:null).filter(c=>c!==null),key=win.winningRow+":"+winners.join();if(key===shownVictory)return;shownVictory=key;document.getElementById("appleVictoryText").textContent="🏆 "+winners.map(c=>data.names[c]||t.column+" "+(c+1)).join(" / ")+" "+l.won;if(!d.open)d.showModal();}
function strokeTaken(index,col){return data.marks[index].slice(0,playerCount()).some((value,c)=>c!==col&&value==="stroke");}
function chooseMark(index,col){if(sheetRowLocked(index)||eliminationState()[col])return;cellChoice={index,col};const name=data.names[col]||t.column+" "+(col+1);document.getElementById("markTitle").textContent=l.choose+" "+(index+1)+" — "+name;document.querySelectorAll("[data-mark]").forEach(button=>{button.classList.toggle("selected",button.dataset.mark===data.marks[index][col]);button.disabled=button.dataset.mark==="stroke"&&strokeTaken(index,col);});document.getElementById("markDialog").showModal();}
function setMark(mark){if(!cellChoice||!["apple","stroke","blank"].includes(mark))return;const {index,col}=cellChoice;if(eliminationState()[col]||sheetRowLocked(index)||(mark==="stroke"&&strokeTaken(index,col)))return;const next=JSON.parse(JSON.stringify(data));next.marks[index][col]=mark;if(playerCount()===2&&mark==="apple"&&!eliminationState()[1-col])next.marks[index][1-col]="stroke";if(!persist(next))return;data=next;extendSheet();persist();document.getElementById("markDialog").close();cellChoice=null;render();updateVictory();}
function render(){extendSheet();const table=document.getElementById("sheet");table.innerHTML="";const head=table.createTHead().insertRow(),label=document.createElement("th");label.textContent=t.round;head.append(label);const crossed=cancelledAppleCells(),cancelling=appleCancellingStrokes();data.names.slice(0,playerCount()).forEach((name,c)=>{const th=document.createElement("th"),input=document.createElement("input");input.className="name";input.classList.toggle("eliminated",eliminationState()[c]);input.value=name;input.placeholder=({fr:"Mettre nom",de:"Name eingeben",it:"Inserire nome",rm:"Endatar num",en:"Enter name"}[lang]||"Mettre nom");input.setAttribute("aria-label",input.placeholder);input.oninput=()=>{data.names[c]=input.value;persist();};const nameBox=document.createElement("div");nameBox.className="name-box";nameBox.append(input);th.append(nameBox);head.append(th);});const body=table.createTBody();data.marks.forEach((values,i)=>{const row=body.insertRow(),number=document.createElement("th");number.scope="row";number.textContent=i+1;row.append(number);const locked=sheetRowLocked(i),complete=rowComplete(i);row.classList.toggle("locked",locked);values.slice(0,playerCount()).forEach((v,c)=>{const button=document.createElement("button");button.type="button";button.className="mark";button.disabled=locked||eliminationState()[c];button.classList.toggle("eliminated",eliminationState()[c]);button.classList.toggle("blue",complete&&v==="stroke"&&!cancelling.has(i+":"+c));button.classList.toggle("cancel-stroke",cancelling.has(i+":"+c));button.classList.toggle("crossed",crossed.has(i+":"+c));const win=blueState(),trophy=i===win.winningRow+1&&win.winningRow>=0&&win.counts[c]>=7;if(trophy){button.textContent="🏆";button.classList.add("winner-cell");}else if(v==="apple")button.textContent="🍎";else if(v==="stroke"){const line=document.createElement("span");line.className="stroke";if(cancelling.has(i+":"+c)){button.append(document.createTextNode("("),line,document.createTextNode(")"));}else button.append(line);}else button.textContent=v===null?"---":"";button.setAttribute("aria-label",(data.names[c]||t.column+" "+(c+1))+", "+t.round+" "+(i+1)+", "+(v==="apple"?l.apple:v==="stroke"?l.line:l.blank));button.onclick=()=>chooseMark(i,c);row.insertCell().append(button);});});const toggle=document.getElementById("playersToggle");toggle.classList.toggle("three",playerCount()===3);toggle.setAttribute("aria-checked",String(playerCount()===3));toggle.setAttribute("aria-label",l.players+": "+playerCount());document.getElementById("notice").textContent=l.notice;}
function resumeSheet(item){const restored=normalizeSheet(item);if(!restored||!archiveSheet()||!persist(restored))return;data=restored;shownVictory="";extendSheet();persist();document.getElementById("historyDialog").close();render();updateVictory();}

function openSheetHistory(){const list=document.getElementById("historyList");list.innerHTML="";const history=readHistory();if(!history.length){const p=document.createElement("p");p.textContent=ht.empty;list.append(p);}history.forEach((item,i)=>{const sheet=normalizeSheet(item);if(!sheet)return;const box=document.createElement("section");box.className="saved-sheet";const title=document.createElement("strong");title.textContent="#"+(history.length-i)+" — "+new Date(item.date).toLocaleString(document.documentElement.lang);box.append(title);const count=sheet.playerCount===2?2:3;sheet.names.slice(0,count).forEach((name,c)=>{const p=document.createElement("p"),lines=sheet.marks.filter(row=>row[c]==="stroke").length,apples=sheet.marks.filter(row=>row[c]==="apple").length;p.textContent=(name||t.column+" "+(c+1))+" : "+lines+" "+l.lines+", "+apples+" "+l.apples;if(blueState(sheet).counts[c]>=7){p.classList.add("history-winner");const trophy=document.createElement("span");trophy.textContent="🏆";p.prepend(trophy);}box.append(p);});const resume=document.createElement("button");resume.type="button";resume.className="resume-sheet";resume.title=l.resume;resume.setAttribute("aria-label",l.resume);resume.innerHTML=cardsIcon;resume.onclick=()=>resumeSheet(item);const remove=document.createElement("button");remove.type="button";remove.className="delete-saved";remove.textContent="×";remove.setAttribute("aria-label",l.delete);remove.onclick=()=>ask(l.delete,()=>{const all=readHistory(),index=all.findIndex(v=>JSON.stringify(v)===JSON.stringify(item));if(index<0)return;all.splice(index,1);try{localStorage.setItem(HISTORY_KEY,JSON.stringify(all));}catch(e){document.getElementById("notice").textContent=l.error;return;}document.getElementById("historyDialog").close();openSheetHistory();});box.append(resume,remove);list.append(box);});document.getElementById("historyDialog").showModal();}
