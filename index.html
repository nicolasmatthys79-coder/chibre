h2{font:700 20px Georgia,serif;margin:0 0 12px}.annrow{display:grid;grid-template-columns:minmax(0,1fr) 38px 32px 38px;gap:4px;align-items:center;padding:7px 0;border-top:1px solid #ece8df}

<script>
"use strict";
const MAX=157, NROUNDS=12;
const announcements=[
 {key:"20",label:"20",value:20},
 {key:"50",label:"50",value:50},
 {key:"100",label:"100",value:100},
 {key:"150",label:"150",value:150},
 {key:"200",label:"200",value:200},
 {key:"match",label:"Match",value:257}
];
let state={
 nameA:"",nameB:"",mode:1000,
 rounds:Array.from({length:NROUNDS},()=>({a:null,b:null})),
 annA:{},annB:{}
};
let winnerShownFor=null;
let dismissedWinner=null;
function syncScrollLock(){
 const slate=document.getElementById("slateDialog");
 const isOpen=!!slate?.open;
 document.documentElement.classList.toggle("slate-open",isOpen);
 if(!isOpen){
  document.documentElement.style.removeProperty("overflow");
  document.body.style.removeProperty("overflow");
  const toast=document.getElementById("winToast");
  if(toast?.parentElement===slate)document.body.appendChild(toast);
 }
}
function closeWinner(){
 dismissedWinner=winnerShownFor;
 document.getElementById("winToast").classList.remove("show");
 syncScrollLock();
}


function showWinner(name,total,threshold){
 const toast=document.getElementById("winToast");
 const slate=document.getElementById("slateDialog");
 if(slate.open && toast.parentElement!==slate)slate.appendChild(toast);
 document.getElementById("winnerMessage").textContent=t("win",{name,total});
 winnerShownFor=state.mode+"|"+name+"|"+threshold;
 if(dismissedWinner!==winnerShownFor)toast.classList.add("show");
}


function load(){
 try{
  const x=JSON.parse(localStorage.getItem("chibre_clean_v1"));
  if(x && Array.isArray(x.rounds) && x.rounds.length===NROUNDS) state=x;
 }catch(e){}
 document.getElementById("nameA").value=state.nameA||"";
 document.getElementById("nameB").value=state.nameB||"";
}
function recordWinner(preferredTeam){
 if(state.winnerTeam) return;
 const threshold=state.mode===1500?1500:1000;
 const reachedA=(roundTotal("a")+annTotal("A"))*factor()>=threshold;
 const reachedB=(roundTotal("b")+annTotal("B"))*factor()>=threshold;
 if(reachedA && !reachedB) state.winnerTeam="A";
 else if(reachedB && !reachedA) state.winnerTeam="B";
 else if(reachedA && reachedB && preferredTeam) state.winnerTeam=preferredTeam;
}
function save(){
 recordWinner();
 state.nameA=document.getElementById("nameA").value||"";
 state.nameB=document.getElementById("nameB").value||"";
 localStorage.setItem("chibre_clean_v1",JSON.stringify(state));
}
function factor(){ return state.mode===1500 ? 2 : 1; }
function setMode(mode){
 const nextMode=mode===1500?1500:1000;
 if(state.mode!==nextMode){
  state.mode=nextMode;
  if(state.winnerTeam){
   const winner=state.winnerTeam;
   const total=(roundTotal(winner.toLowerCase())+annTotal(winner))*factor();
   if(total<nextMode)state.winnerTeam=null;
  }
  winnerShownFor=null;dismissedWinner=null;
  document.getElementById("winToast").classList.remove("show");
 }
 save();render();
}
function lastCompletedRound(){
 let last=-1;state.rounds.forEach((r,i)=>{if(r.a!==null&&r.b!==null)last=i;});return last;
}
function recheckCorrectedWinner(){
 if(!state.winnerTeam)return;
 const winner=state.winnerTeam;
 if((roundTotal(winner.toLowerCase())+annTotal(winner))*factor()<(state.mode===1500?1500:1000)){
  state.winnerTeam=null;winnerShownFor=null;dismissedWinner=null;
 }
}
function syncSharedRound(i){
 if(!state.slateLastEntries)state.slateLastEntries={};
 for(const team of ["A","B"]){
  const key=team.toLowerCase(),other=key==="a"?"b":"a",r=state.rounds[i];
  state.slateLastEntries[team]={kind:"points",value:r[key],rawValue:r[key],rawOther:r[other],match:r[key]===257,roundIndex:i,roundNumber:i+1};
 }
}
function clearSharedRoundEntries(){
 for(const team of ["A","B"]){const entry=state.slateLastEntries?.[team];if(Number.isInteger(entry?.roundIndex)&&state.rounds[entry.roundIndex]?.a===null)delete state.slateLastEntries[team];}
}
function setRound(i,team,raw){
 if(requireInitialTrump())return;
 if(i<lastCompletedRound())return;
 if(state.winnerTeam&&i!==lastCompletedRound())return;
 if(i>=visibleRoundCount()) return;
 if(state.rounds.slice(0,i).some(r=>r.a===null || r.b===null)) return;
 const r=state.rounds[i];
 if(raw===""){state.rounds.slice(i).forEach(r=>{r.a=null;r.b=null});clearSharedRoundEntries();recheckCorrectedWinner();save();render();renderSlate();return}
 const n=Number(raw);
 if(!Number.isInteger(n) || (n!==257 && (n<2 || n>MAX-2))){
   alert(t("validation"));
   render();return;
 }
 const wasCompleted=r.a!==null&&r.b!==null;
 const other=n===257?0:MAX-n;
 if(wasCompleted)dismissedWinner=null;
 if(team==="a"){r.a=n;r.b=other}else{r.b=n;r.a=other}
 syncSharedRound(i);
 resetAnnCounters();
 recheckCorrectedWinner();
 recordWinner(team.toUpperCase());

}
function currentAnnCounters(team){
 if(!state.currentAnnCounters)state.currentAnnCounters={A:{},B:{}};
 return state.currentAnnCounters[team];
}
function resetAnnCounters(){state.currentAnnCounters={A:{},B:{}};state.annCounterEpoch=(state.annCounterEpoch||0)+1;}
function currentAnnCount(team){return Object.values(currentAnnCounters(team)).reduce((sum,n)=>sum+n,0);}
const announcementLimits={20:6,50:4,100:3,150:1,200:1};
const announcementCards={20:3,50:4,100:5,150:4,200:4};
function announcementCardCount(counts){return Object.entries(announcementCards).reduce((sum,[key,cards])=>sum+(counts[key]||0)*cards,0);}
function announcementCapacity(team,key,removed=0){
 const counts=currentAnnCounters(team),cards=announcementCards[key];
 const countLimit=(announcementLimits[key]??Infinity)-(counts[key]||0)+removed;
 const cardLimit=cards?Math.floor((18-announcementCardCount(counts)+removed*cards)/cards):Infinity;
 return Math.max(0,Math.min(countLimit,cardLimit));
}
function changeAnn(team,key,delta){
 if(requireInitialTrump())return;
 if(state.winnerTeam)return;
 const obj=team==="A"?state.annA:state.annB;

 // MATCH correspond à une donne complète : on l'inscrit sur la prochaine ligne libre.
 if(key==="match"){
   if(delta>0){
     const idx=state.rounds.findIndex(r=>r.a===null && r.b===null);
     if(idx===-1){ alert(t("full")); return; }
     if(idx>=visibleRoundCount()) return;
     resetAnnCounters();
     if(team==="A"){
       state.rounds[idx].a=257;
       state.rounds[idx].b=0;
     }else{
       state.rounds[idx].a=0;
       state.rounds[idx].b=257;
     }
     syncSharedRound(idx);

   }else{
     // Retire le dernier MATCH de cette équipe et libère sa ligne.
     for(let i=state.rounds.length-1;i>=0;i--){
       const r=state.rounds[i];
       if((team==="A" && r.a===257 && r.b===0) || (team==="B" && r.b===257 && r.a===0)){
         state.rounds.slice(i).forEach(round=>{round.a=null;round.b=null});
         clearSharedRoundEntries();

         break;
       }
     }
   }
   recordWinner(team);
   save();render();renderSlate();return;
 }

 const counters=currentAnnCounters(team);
 if(delta>0&&announcementCapacity(team,key)<delta)return;
 if(delta<0&&!(counters[key]>0))return;
 counters[key]=Math.max(0,(counters[key]||0)+delta);
 obj[key]=Math.max(0,(obj[key]||0)+delta);
 recordWinner(team);
 save();render();
}
function matchCount(team){

function annTotal(team){
 const obj=team==="A"?state.annA:state.annB;
 return announcements.reduce((sum,x)=>x.key==="match" ? sum : sum+(obj[x.key]||0)*x.value,0)+(state.slateAnnouncements?.[team]||0);
}
function roundTotal(team){
 return state.rounds.reduce((sum,r)=>sum+(r[team]===null?0:r[team]),0)+(state.slatePoints?.[team]||0);
}

function slateBreakdown(total){
 const value=Math.max(0,Math.floor(Number(total)||0));
 const hundreds=Math.floor(value/100),afterHundreds=value%100;
 const fifties=Math.floor(afterHundreds/50),afterFifties=afterHundreds%50;
 const twenties=Math.floor(afterFifties/20),remainder=afterFifties%20;
